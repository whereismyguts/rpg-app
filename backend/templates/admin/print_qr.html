{% extends "layout.html" %}

{% block content %}
<div class="container-fluid">
    <div class="col-12">
        <div class="card d-print-none mb-3">
            <div class="card-header">
                <h3 class="card-title">Печать QR-кодов игроков</h3>
            </div>
            <div class="card-body">
                <div class="d-flex align-items-center gap-3 mb-2">
                    <input type="text" id="search" class="form-control" style="max-width:300px" placeholder="Поиск по имени..." oninput="filterCards()">
                    <button class="btn btn-primary" onclick="window.print()">
                        <i class="fa-solid fa-print"></i> Печать
                    </button>
                </div>
                <p class="mb-0">Показано: <strong id="count">{{ users|length }}</strong> / {{ users|length }}</p>
            </div>
        </div>

        <div class="qr-grid">
            {% for user in users %}
            <div class="qr-card">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=LOGIN:{{ user.player_uuid }}"
                     alt="QR {{ user.player_uuid }}" class="qr-img">
                <div class="qr-name">{{ user.name }}</div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>

<style>
    .qr-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 20px;
        padding: 20px;
    }

    .qr-card {
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 15px;
        text-align: center;
        background: white;
        page-break-inside: avoid;
        font-family: 'Courier New', Courier, monospace;
    }

    .qr-img {
        width: 150px;
        height: 150px;
        display: block;
        margin: 0 auto 10px;
    }

    .qr-name {
        font-weight: bold;
        font-size: 14px;
        margin-bottom: 4px;
        word-wrap: break-word;
    }

    .qr-uuid {
        font-family: monospace;
        font-size: 12px;
        color: #666;
    }

    @media print {
        .d-print-none {
            display: none !important;
        }

        body {
            background: white !important;
        }

        .qr-grid {
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            padding: 10px;
        }

        .qr-card {
            border: 1px solid #000;
            padding: 10px;
            margin-bottom: 0;
        }

        .qr-img {
            width: 120px;
            height: 120px;
        }

        .qr-name {
            font-size: 12px;
        }

        .qr-uuid {
            font-size: 10px;
        }
    }
</style>
<script>
function filterCards() {
    const q = document.getElementById('search').value.toLowerCase();
    const cards = document.querySelectorAll('.qr-card');
    let visible = 0;
    cards.forEach(card => {
        const name = card.querySelector('.qr-name').textContent.toLowerCase();
        const show = name.includes(q);
        card.style.display = show ? '' : 'none';
        if (show) visible++;
    });
    document.getElementById('count').textContent = visible;
}
</script>
{% endblock %}
