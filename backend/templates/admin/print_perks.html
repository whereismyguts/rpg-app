{% extends "layout.html" %}

{% block content %}
<div class="container-fluid">
    <div class="col-12">
        <div class="card d-print-none mb-3">
            <div class="card-header">
                <h3 class="card-title">Печать QR-кодов перков</h3>
            </div>
            <div class="card-body">
                <p>Всего перков: <strong>{{ perks|length }}</strong></p>
                <button class="btn btn-primary" onclick="window.print()">
                    <i class="fa-solid fa-print"></i> Печать
                </button>
            </div>
        </div>

        <div class="qr-grid">
            {% for perk in perks %}
            <div class="qr-card">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=PERK:{{ perk.perk_id }}"
                     alt="QR {{ perk.perk_id }}" class="qr-img">
                <div class="qr-name">{{ perk.name }}</div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>

<style>
    .qr-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 20px;
        padding: 20px;
    }

    .qr-card {
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 15px;
        text-align: center;
        background: white;
        page-break-inside: avoid;
    }

    .qr-img {
        width: 150px;
        height: 150px;
        display: block;
        margin: 0 auto 10px;
    }

    .qr-name {
        font-weight: bold;
        font-size: 14px;
        margin-bottom: 4px;
        word-wrap: break-word;
    }

    @media print {
        .d-print-none {
            display: none !important;
        }

        body {
            background: white !important;
        }

        .qr-grid {
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            padding: 10px;
        }

        .qr-card {
            border: 1px solid #000;
            padding: 10px;
            margin-bottom: 0;
        }

        .qr-img {
            width: 120px;
            height: 120px;
        }

        .qr-name {
            font-size: 12px;
        }
    }
</style>
{% endblock %}
